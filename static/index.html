<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GGWord - 个人单词本</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1><i class="fas fa-book"></i> GGWord</h1>
            <p class="subtitle">我的个人单词本</p>
        </header>

        <nav class="nav-tabs">
            <button class="tab-btn active" data-tab="words">
                <i class="fas fa-list"></i> 单词列表
            </button>
            <button class="tab-btn" data-tab="add">
                <i class="fas fa-plus"></i> 添加单词
            </button>
            <button class="tab-btn" data-tab="practice">
                <i class="fas fa-brain"></i> 练习模式
            </button>
            <button class="tab-btn" data-tab="stats">
                <i class="fas fa-chart-bar"></i> 统计信息
            </button>
        </nav>

        <main class="main-content">
            <!-- 单词列表标签页 -->
            <section id="words-tab" class="tab-content active">
                <div class="search-bar">
                    <input type="text" id="search-input" placeholder="搜索单词...">
                    <i class="fas fa-search"></i>
                </div>
                
                <div class="filter-options">
                    <select id="difficulty-filter">
                        <option value="">所有难度</option>
                        <option value="1">简单 ⭐</option>
                        <option value="2">容易 ⭐⭐</option>
                        <option value="3">中等 ⭐⭐⭐</option>
                        <option value="4">困难 ⭐⭐⭐⭐</option>
                        <option value="5">极难 ⭐⭐⭐⭐⭐</option>
                    </select>
                    <select id="sort-by">
                        <option value="created">按创建时间</option>
                        <option value="english">按英文排序</option>
                        <option value="difficulty">按难度排序</option>
                        <option value="review">按复习次数</option>
                    </select>
                </div>

                <div id="words-list" class="words-list">
                    <!-- 单词卡片将在这里动态加载 -->
                </div>
            </section>

            <!-- 添加单词标签页 -->
            <section id="add-tab" class="tab-content">
                <form id="add-word-form" class="word-form">
                    <div class="form-group">
                        <label for="english">英文单词 *</label>
                        <input type="text" id="english" name="english" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="chinese">中文意思 *</label>
                        <input type="text" id="chinese" name="chinese" required>
                    </div>
                    
                    <div class="form-group">
                        <label for="pronunciation">音标</label>
                        <input type="text" id="pronunciation" name="pronunciation" placeholder="例: /həˈloʊ/">
                    </div>
                    
                    <div class="form-group">
                        <label for="example">例句</label>
                        <textarea id="example" name="example" rows="3" placeholder="请输入例句..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <label for="difficulty">难度等级</label>
                        <select id="difficulty" name="difficulty">
                            <option value="1">简单 ⭐</option>
                            <option value="2">容易 ⭐⭐</option>
                            <option value="3" selected>中等 ⭐⭐⭐</option>
                            <option value="4">困难 ⭐⭐⭐⭐</option>
                            <option value="5">极难 ⭐⭐⭐⭐⭐</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn-primary">
                        <i class="fas fa-plus"></i> 添加单词
                    </button>
                </form>
            </section>

            <!-- 练习模式标签页 -->
            <section id="practice-tab" class="tab-content">
                <div class="practice-mode">
                    <div class="practice-controls">
                        <button id="start-practice" class="btn-primary">
                            <i class="fas fa-play"></i> 开始练习
                        </button>
                        <select id="practice-type">
                            <option value="en-to-cn">英译中</option>
                            <option value="cn-to-en">中译英</option>
                            <option value="mixed">混合模式</option>
                        </select>
                    </div>
                    
                    <div id="practice-card" class="practice-card hidden">
                        <div class="practice-question">
                            <h3 id="practice-word"></h3>
                            <p id="practice-pronunciation"></p>
                        </div>
                        
                        <div class="practice-answer hidden">
                            <h4 id="practice-translation"></h4>
                            <p id="practice-example"></p>
                        </div>
                        
                        <div class="practice-buttons">
                            <button id="show-answer" class="btn-secondary">显示答案</button>
                            <button id="know-it" class="btn-success hidden">认识</button>
                            <button id="dont-know" class="btn-danger hidden">不认识</button>
                            <button id="next-word" class="btn-primary hidden">下一个</button>
                        </div>
                        
                        <div class="practice-progress">
                            <span id="practice-current">0</span> / <span id="practice-total">0</span>
                        </div>
                    </div>
                </div>
            </section>

            <!-- 统计信息标签页 -->
            <section id="stats-tab" class="tab-content">
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-number" id="total-words">0</div>
                        <div class="stat-label">总单词数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="total-reviews">0</div>
                        <div class="stat-label">总复习次数</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="avg-difficulty">0</div>
                        <div class="stat-label">平均难度</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-number" id="mastered-words">0</div>
                        <div class="stat-label">熟练单词</div>
                    </div>
                </div>
                
                <div class="difficulty-chart">
                    <h3>难度分布</h3>
                    <div class="chart-bars" id="difficulty-chart">
                        <!-- 图表将在这里生成 -->
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- 编辑单词模态框 -->
    <div id="edit-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>
            <h2>编辑单词</h2>
            <form id="edit-word-form" class="word-form">
                <input type="hidden" id="edit-id">
                
                <div class="form-group">
                    <label for="edit-english">英文单词 *</label>
                    <input type="text" id="edit-english" name="english" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-chinese">中文意思 *</label>
                    <input type="text" id="edit-chinese" name="chinese" required>
                </div>
                
                <div class="form-group">
                    <label for="edit-pronunciation">音标</label>
                    <input type="text" id="edit-pronunciation" name="pronunciation">
                </div>
                
                <div class="form-group">
                    <label for="edit-example">例句</label>
                    <textarea id="edit-example" name="example" rows="3"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="edit-difficulty">难度等级</label>
                    <select id="edit-difficulty" name="difficulty">
                        <option value="1">简单 ⭐</option>
                        <option value="2">容易 ⭐⭐</option>
                        <option value="3">中等 ⭐⭐⭐</option>
                        <option value="4">困难 ⭐⭐⭐⭐</option>
                        <option value="5">极难 ⭐⭐⭐⭐⭐</option>
                    </select>
                </div>
                
                <div class="modal-buttons">
                    <button type="button" class="btn-secondary cancel-btn">取消</button>
                    <button type="submit" class="btn-primary">保存修改</button>
                </div>
            </form>
        </div>
    </div>

    <!-- 通知消息 -->
    <div id="notification" class="notification hidden">
        <span id="notification-message"></span>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
